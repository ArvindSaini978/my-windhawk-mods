name: Auto-Update README & Docs

on:
  push:
    branches:
      - master
    paths:
      - 'mods/**.wh.cpp'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Readme Generator
        run: python .github/scripts/update_readme.py

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md mods/
          if git diff --staged --quiet; then
            echo "No documentation or metadata changes detected. Skipping commit."
          else
            git commit -m "docs: sync mod readmes and index [skip ci]"
            git push
          fi
